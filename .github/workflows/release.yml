name: Release

# One workflow, because the two publishes are ordered rather than independent:
# the MCP Registry verifies that the PyPI package exists before it accepts the
# entry. As two tag-triggered workflows they would race and the registry half
# would lose. `needs` is what makes the order a fact instead of a hope.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI trades for an upload token
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata
        run: uvx twine check dist/*

      # A re-run of this workflow — after a failure in the registry job, or a
      # workflow_dispatch to check the setup — must not fail merely because the
      # version is already out. PyPI rejects any re-upload of a filename, and
      # --check-url does not cover it: it skips a file only when the hash
      # matches, and a wheel rebuilt on a runner is not byte-identical to the
      # published one. So the version is checked before anything is uploaded.
      - name: Is this version already on PyPI?
        id: released
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nodriver-mcp/$VERSION/json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on PyPI — skipping the upload."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is not on PyPI yet — publishing."
          fi

      # No API token anywhere: `always` makes uv fail loudly if the OIDC
      # exchange does not work, rather than quietly falling back to credentials
      # that do not exist here. --check-url stays as the narrower guard, for a
      # previous run that uploaded one of the two files and then died.
      - name: Publish
        if: steps.released.outputs.skip == 'false'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/nodriver-mcp/

  registry:
    name: publish to MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC, so no registry token has to be stored
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # On a tag the tag wins, so the entry can never disagree with the release.
      # On a manual dispatch there is no tag to read, so server.json stands as
      # committed rather than being rewritten with a branch name.
      - name: Pin server.json to the tagged version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
            mv server.tmp server.json
            echo "pinned to $VERSION"
          else
            echo "not a tag ref — using server.json as committed"
          fi
          cat server.json

      # Same reasoning as the PyPI guard above: the registry rejects a duplicate
      # version, so without this a re-run fails on the half that already
      # succeeded. Read after the pin step, so it checks the version that would
      # actually be published.
      - name: Is this version already in the registry?
        id: registered
        run: |
          NAME=$(jq -r .name server.json)
          VERSION=$(jq -r .version server.json)
          FOUND=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME&limit=100" \
            | jq -r --arg n "$NAME" --arg v "$VERSION" \
              '[.servers[] | (.server // .) | select(.name == $n and .version == $v)] | length')
          if [ "$FOUND" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already in the registry — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is not in the registry yet — publishing."
          fi

      - name: Authenticate to MCP Registry
        if: steps.registered.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.registered.outputs.skip == 'false'
        run: ./mcp-publisher publish
