name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # No browser is launched: these assert on the schemas the server hands to
      # a client, and on the docs staying in step with them. The browser tests
      # are excluded by addopts and run in the `browser` job instead.
      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Check docs/TOOLS.md is up to date
        run: |
          uv run python scripts/generate_tool_docs.py
          git diff --exit-code docs/TOOLS.md
        shell: bash

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # These launch a real Chrome, which the schema tests cannot substitute
      # for: the cookie-scope bug they cover left every schema correct. One OS
      # is enough — it is CDP behaviour under test, not the platform.
      - name: Diagnose the browser situation
        run: |
          echo "--- whoami / userns ---"
          id
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo "(no unprivileged_userns_clone)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(no apparmor knob)"
          echo "--- what browsers exist ---"
          for b in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge; do
            p=$(command -v $b 2>/dev/null) && echo "$b -> $p ($($b --version 2>&1 | head -1))"
          done
          ls -la /opt/google/chrome/chrome 2>/dev/null || echo "(no /opt/google/chrome)"
          echo "--- can it start headless at all? ---"
          google-chrome --headless=new --no-sandbox --dump-dom about:blank 2>&1 | head -5 || true
        shell: bash

      - name: Diagnose nodriver itself
        run: |
          uv run --group dev python - <<'EOF'
          import asyncio, traceback
          import nodriver as uc

          async def attempt(label, **kw):
              print(f"=== {label}: {kw}")
              try:
                  b = await uc.start(**kw)
                  print("   OK, connected")
                  b.stop()
              except Exception as e:
                  print(f"   FAILED: {type(e).__name__}: {str(e)[:200]}")

          async def main():
              await attempt("headless only", headless=True)
              await attempt("headless + no-sandbox", headless=True,
                            browser_args=["--no-sandbox"])
              await attempt("headless + no-sandbox + sandbox=False", headless=True,
                            sandbox=False, browser_args=["--no-sandbox"])
          asyncio.run(main())
          EOF
        shell: bash
        continue-on-error: true

      - name: Run browser tests
        run: uv run --group dev pytest -m slow -q
        env:
          NODRIVER_HEADLESS: "true"
          # ubuntu-latest is 24.04, which blocks unprivileged user namespaces,
          # so Chrome's sandbox cannot start here.
          NODRIVER_TEST_EXTRA_ARGS: "--no-sandbox"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
