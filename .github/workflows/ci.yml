name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # No browser is launched: these assert on the schemas the server hands to
      # a client, and on the docs staying in step with them. The browser tests
      # are excluded by addopts and run in the `browser` job instead.
      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Check docs/TOOLS.md is up to date
        run: |
          uv run python scripts/generate_tool_docs.py
          git diff --exit-code docs/TOOLS.md
        shell: bash

  browser:
    name: browser tests
    # Windows, not ubuntu: the runner's 24.04 image blocks unprivileged user
    # namespaces, and nodriver cannot bring Chrome up there at all — not with
    # --no-sandbox, not with sandbox=False. These tests assert CDP behaviour,
    # so they belong on a platform where a desktop Chrome behaves normally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # These launch a real Chrome, which the schema tests cannot substitute
      # for: the cookie-scope bug they cover left every schema correct.
      - name: Run browser tests
        run: uv run --group dev pytest -m slow -q
        env:
          NODRIVER_HEADLESS: "true"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
